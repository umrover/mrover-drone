[env:upesy_wroom]
platform = espressif32
board = upesy_wroom
framework = arduino
monitor_speed = 115200
lib_deps = 
    mobizt/FirebaseClient@^2.2.2
    adafruit/Adafruit Unified Sensor@^1.1.15
    adafruit/Adafruit ADXL345@^1.3.4